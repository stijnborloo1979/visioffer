<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offerte laden...</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f0f2f5;min-height:100vh}
  .ld{text-align:center;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
  .ld h2{color:#1a1a2e;margin-bottom:12px}
  .ld p{color:#6c757d;font-size:14px}
  .sp{width:40px;height:40px;border:4px solid #dee2e6;border-top-color:var(--brand,#2563eb);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{color:var(--brand,#2563eb);font-weight:700}
  /* Sandboxed iframe neemt heel het venster over als de offerte geladen is */
  #quote-frame{display:none;position:fixed;inset:0;width:100%;height:100%;border:none;background:#fff;z-index:10}
</style>
</head>
<body>

<div class="ld" id="loader">
  <div class="sp"></div>
  <h2>Offerte wordt geladen</h2>
  <p>Even geduld...</p>
</div>

<!-- Sandboxed iframe: voorkomt dat opgeslagen HTML scripts kan uitvoeren
     die toegang hebben tot de parent-pagina (cookies, localStorage, etc.).
     allow-scripts is nodig voor de ondertekenfunctionaliteit,
     maar allow-same-origin is BEWUST WEGGELATEN zodat de iframe
     geen toegang heeft tot het parent-domein. -->
<iframe id="quote-frame"
  sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"
  referrerpolicy="no-referrer"
  title="Offerte weergave">
</iframe>

<script>
(function(){
  var SUPA_URL  = "https://dgzkuqvviivoafinrfty.supabase.co";
  var SUPA_ANON = "sb_publishable_tBJ3WekHvNawQCECwdgT5Q_F2bI-769";

  var params = new URLSearchParams(window.location.search);
  var id     = params.get("id");

  // Themakleur van de loader per tenant
  var BRAND = { "default":"#2563eb" };
  var tenant = params.get("tenant") || "default";
  document.documentElement.style.setProperty("--brand", BRAND[tenant] || BRAND["default"]);

  if(!id){
    document.getElementById("loader").innerHTML = '<p class="err">Geen offerte-ID opgegeven.</p>';
    return;
  }

  fetch(SUPA_URL + "/rest/v1/signing_pages?id=eq." + encodeURIComponent(id) + "&select=html_content", {
    headers: {
      "apikey": SUPA_ANON,
      "Authorization": "Bearer " + SUPA_ANON
    }
  })
  .then(function(r){ return r.json(); })
  .then(function(rows){
    if(!rows || !rows.length || !rows[0].html_content){
      document.getElementById("loader").innerHTML = '<p class="err">Offerte niet gevonden of verlopen.</p>';
      return;
    }

    /* ── VEILIG: gebruik een sandboxed iframe i.p.v. document.write() ──
       De iframe heeft GEEN allow-same-origin, dus scripts in de offerte-HTML
       kunnen niet bij cookies, localStorage of het parent-venster. */
    var frame = document.getElementById("quote-frame");
    var blob  = new Blob([rows[0].html_content], { type: "text/html; charset=utf-8" });
    var url   = URL.createObjectURL(blob);

    frame.onload = function(){
      /* Blob URL opruimen na laden */
      URL.revokeObjectURL(url);
    };
    frame.src = url;

    /* Loader verbergen, iframe tonen */
    document.getElementById("loader").style.display = "none";
    frame.style.display = "block";
  })
  .catch(function(e){
    document.getElementById("loader").innerHTML = '<p class="err">Fout bij laden. Probeer de pagina te vernieuwen.</p>';
  });
})();
</script>
</body>
</html>
